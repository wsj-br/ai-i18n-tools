name: Deploy Docs

on:
  release:
    types: [published]
  workflow_dispatch:

# Scoped at workflow level; deploy steps need pages + OIDC (see job below).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy in one job so we only need a single hosted runner.
  # A separate deploy job can fail with "job was not acquired by Runner" when
  # GitHub's runner pool is under pressure, even though the build already succeeded.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # `standalone: true` installs `@pnpm/exe` directly; the npm bootstrap path runs in the
      # repo and older pnpm cannot read lockfiles generated by 11.12.0+.
      - uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation site
        run: pnpm run docs:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
