name: CI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_as_latest:
        description: "Publish to npm with the 'latest' dist-tag (manual runs only; use after fixing the branch)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      # Version comes from `packageManager` in package.json. Corepack avoids
      # pnpm/action-setup bootstrap issues with pnpm 11.12 lockfiles and npm's
      # blocked @pnpm/exe install scripts on Node 24 runners.
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `src/build-info.generated.ts` is gitignored; `pnpm build` writes it, but CI runs `lint` (typecheck)
      # before `build`, so generate the stub here so `tsc` can resolve `../build-info.generated.js`.
      - name: Generate build metadata
        run: node scripts/write-build-info.mjs

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

  publish:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_as_latest == 'true')
    runs-on: ubuntu-latest
    # Optional: Settings → Environments → `npm` — add protection rules, required reviewers, or wait timers before publish.
    environment: npm
    # Publishing: prefer npm Trusted Publishers (OIDC) — configure on npmjs with workflow file `ci.yml`
    # (name must match exactly). If OIDC is not set up or the workflow name mismatches, set
    # `NPM_TOKEN` (granular publish token) as a repo secret. See https://docs.npmjs.com/trusted-publishers/
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          # Seeds project `.npmrc` for `registry.npmjs.org`; auth for `npm publish` comes from `NODE_AUTH_TOKEN` on the publish step.
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Trusted publishing needs npm ≥ 11.5.1 (Node 22 ships npm 10.x). Do not `npm install -g npm@…` on
      # hosted runners — it can corrupt the bundled CLI (`Cannot find module 'promise-retry'`). Run the
      # published `npm` package via npx instead.
      # `--ignore-scripts`: skip `prepublishOnly` (clean/build/test); the matrix `build` job already did that.
      # `--provenance`: supply-chain attestation (public repos; npm also attests when using Trusted Publishing).
      - name: Publish to npm
        run: npx --yes npm@^11.5.1 publish --ignore-scripts --provenance --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
